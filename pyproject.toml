[build-system]
requires = ["setuptools>=61.0.0", "wheel"] 
build-backend = "setuptools.build_meta"

[project]
name = "quant-dev"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"

# 預留基礎依賴項，有需要可自行追加
dependencies = [ 
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "yfinance>=0.2.0",
    "pytz>=2022.0",
    "matplotlib>=3.5.0",
    "pyngrok>=7.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "nest-asyncio>=1.5.0",    
]

# 選擇性依賴 (Optional Dependencies)
[project.optional-dependencies]
# 開發用：測試、Linting、格式化
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "httpx>=0.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
